spring.application.name=IntelliStock
# Server Port
server.port=8081
jwt.secret=${JWT_SECRET:SW50ZWxsaVN0b2NrU3VwZXJTZWN1cmVTZWNyZXRLZXlGb3JKd3RBdXRoZW50aWNhdGlvbjIwMjY=}

# MySQL DataSource Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/intellistock_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Disable Spring Security default login prompts during initial build test
spring.security.user.name=admin
spring.security.user.password=admin123